name: Deploy Dashboard to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/dashboard/**'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        run: pnpm --filter @workspace/dashboard run build

      - name: Deploy event-bus-worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: artifacts/event-bus-worker
          command: deploy

      - name: Set secrets on Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_DB: ${{ secrets.NEON_DATABASE_URL }}
          SESSION_SECRET_VAL: ${{ secrets.SESSION_SECRET }}
          SUPABASE_URL_VAL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY_VAL: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SA_VAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$NEON_DB" | pnpm dlx wrangler@latest pages secret put NEON_DATABASE_URL --project-name=mr-perfect
          echo "$SESSION_SECRET_VAL" | pnpm dlx wrangler@latest pages secret put SESSION_SECRET --project-name=mr-perfect
          echo "$SUPABASE_URL_VAL" | pnpm dlx wrangler@latest pages secret put SUPABASE_URL --project-name=mr-perfect
          echo "$SUPABASE_KEY_VAL" | pnpm dlx wrangler@latest pages secret put SUPABASE_SERVICE_ROLE_KEY --project-name=mr-perfect
          echo "$FIREBASE_SA_VAL" | pnpm dlx wrangler@latest pages secret put FIREBASE_SERVICE_ACCOUNT_JSON --project-name=mr-perfect

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@latest pages deploy artifacts/dashboard/dist/public --project-name=mr-perfect --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
